<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>شاورما السلطان</title>
<meta name="description" content="تطبيق طلبات شاورما السلطان — اطلب شاورما، وجبات، وساندوتشات بتوصيل سريع">
<meta name="theme-color" content="#c22a1f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  @font-face {
    font-family: 'Tajawal';
    src: local('Tajawal');
  }

  :root{
    --char:        #1a1210;   /* near-black charcoal, base */
    --char-2:      #241a16;   /* raised surface */
    --char-3:      #2f221c;   /* card surface */
    --ember:       #c22a1f;   /* main brand red */
    --ember-dark:  #8f1d15;
    --flame:       #e8722c;   /* orange accent */
    --gold:        #d4a429;   /* price / highlight */
    --smoke:       #a8998f;   /* muted text on dark */
    --bone:        #f5efe8;   /* main light text */
    --line:        #3c2c24;
    --success:     #4a7c4e;
  }

  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}

  html,body{
    height:100%;
    background:var(--char);
    color:var(--bone);
    font-family:'Segoe UI', 'Tajawal', -apple-system, sans-serif;
    overscroll-behavior:none;
  }

  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    background:var(--char);
    position:relative;
    display:flex;
    flex-direction:column;
    background-image:
      radial-gradient(ellipse at top, rgba(194,42,31,0.10), transparent 60%);
  }

  /* ---------- Top bar ---------- */
  .topbar{
    position:sticky; top:0; z-index:40;
    display:flex; align-items:center; gap:12px;
    padding:14px 16px;
    background:rgba(26,18,16,0.92);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  .topbar .logo-mark{
    width:40px; height:40px; border-radius:50%;
    border:2px solid var(--bone);
    background:var(--bone);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
    overflow:hidden;
  }
  .topbar .logo-mark svg{width:100%;height:100%;}
  .topbar h1{
    font-size:19px; font-weight:800; letter-spacing:0.3px; color:var(--bone);
    flex:1;
  }
  .topbar .hotline-pill{
    display:flex; align-items:center; gap:6px;
    background:var(--ember);
    color:#fff; font-weight:700; font-size:13px;
    padding:7px 12px; border-radius:20px;
    text-decoration:none;
    box-shadow:0 2px 10px rgba(194,42,31,0.4);
  }

  /* ---------- Scroll area ---------- */
  .screen{
    flex:1;
    overflow-y:auto;
    padding-bottom:88px;
  }
  .screen::-webkit-scrollbar{display:none;}

  /* ---------- Hero ---------- */
  .hero{
    position:relative;
    margin:14px 16px 6px;
    border-radius:18px;
    overflow:hidden;
    height:190px;
    background:#000;
  }
  .hero img{
    width:100%; height:100%; object-fit:cover;
    opacity:0.88;
  }
  .hero::after{
    content:'';
    position:absolute; inset:0;
    background:linear-gradient(0deg, rgba(15,10,8,0.92) 5%, rgba(15,10,8,0.15) 55%, transparent 80%);
  }
  .hero-text{
    position:absolute; right:18px; bottom:16px; left:18px; z-index:2;
  }
  .hero-text .eyebrow{
    color:var(--flame); font-weight:700; font-size:13px; margin-bottom:4px;
  }
  .hero-text h2{
    font-size:22px; font-weight:800; color:#fff; line-height:1.3;
  }
  .hero-text .price-tag{
    display:inline-block; margin-top:8px;
    background:var(--gold); color:#1a1210; font-weight:800; font-size:15px;
    padding:5px 14px; border-radius:8px;
  }

  /* ---------- Category chips ---------- */
  .cats{
    display:flex; gap:8px; overflow-x:auto;
    padding:14px 16px 10px;
    scrollbar-width:none;
  }
  .cats::-webkit-scrollbar{display:none;}
  .chip{
    flex-shrink:0;
    padding:9px 18px;
    border-radius:22px;
    background:var(--char-3);
    border:1px solid var(--line);
    color:var(--smoke);
    font-size:14px; font-weight:600;
    cursor:pointer;
    transition:all .15s ease;
    white-space:nowrap;
  }
  .chip.active{
    background:var(--ember);
    border-color:var(--ember);
    color:#fff;
  }

  /* ---------- Section ---------- */
  .section{padding:4px 16px 18px;}
  .section-title{
    font-size:16px; font-weight:800; color:var(--bone);
    margin:14px 2px 10px;
    display:flex; align-items:center; gap:8px;
  }
  .section-title .bar{
    width:4px; height:16px; background:var(--flame); border-radius:2px;
  }

  /* ---------- Item card ---------- */
  .item-grid{display:flex; flex-direction:column; gap:10px;}
  .item-card{
    display:flex; gap:12px;
    background:var(--char-3);
    border:1px solid var(--line);
    border-radius:16px;
    padding:10px;
    align-items:center;
  }
  .item-thumb{
    width:76px; height:76px; border-radius:12px;
    background:linear-gradient(135deg, var(--ember-dark), var(--char-2));
    flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-size:30px;
    overflow:hidden;
  }
  .item-thumb img{width:100%;height:100%;object-fit:cover;}
  .item-info{flex:1; min-width:0;}
  .item-info .name{font-size:15px; font-weight:700; color:var(--bone); margin-bottom:3px;}
  .item-info .desc{font-size:12.5px; color:var(--smoke); line-height:1.4; margin-bottom:6px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .item-info .row-bottom{display:flex; align-items:center; justify-content:space-between;}
  .item-info .price{color:var(--gold); font-weight:800; font-size:15px;}
  .add-btn{
    width:32px; height:32px; border-radius:10px;
    background:var(--ember); color:#fff; border:none;
    font-size:18px; font-weight:700;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    flex-shrink:0;
  }
  .add-btn:active{transform:scale(0.92);}

  .qty-control{
    display:flex; align-items:center; gap:10px;
    background:var(--char-2); border-radius:10px; padding:3px;
  }
  .qty-control button{
    width:26px; height:26px; border-radius:7px; border:none;
    background:var(--ember); color:#fff; font-size:16px; font-weight:700;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .qty-control span{font-weight:700; font-size:14px; min-width:14px; text-align:center;}

  /* ---------- Bottom nav ---------- */
  .bottomnav{
    position:fixed; bottom:0; left:50%; transform:translateX(-50%);
    width:100%; max-width:480px;
    display:flex;
    background:rgba(26,18,16,0.97);
    backdrop-filter:blur(10px);
    border-top:1px solid var(--line);
    padding:8px 6px calc(8px + env(safe-area-inset-bottom));
    z-index:50;
  }
  .nav-btn{
    flex:1;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    background:none; border:none; color:var(--smoke);
    font-size:11px; font-weight:600;
    padding:6px 2px;
    cursor:pointer;
    position:relative;
  }
  .nav-btn.active{color:var(--flame);}
  .nav-btn .icon{font-size:20px; line-height:1;}
  .nav-btn .badge{
    position:absolute; top:0; left:calc(50% + 6px);
    background:var(--ember); color:#fff;
    font-size:10px; font-weight:800;
    min-width:16px; height:16px; border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    padding:0 3px;
  }

  /* ---------- Cart ---------- */
  .cart-item{
    display:flex; align-items:center; gap:12px;
    background:var(--char-3); border:1px solid var(--line);
    border-radius:14px; padding:12px; margin-bottom:10px;
  }
  .cart-item .info{flex:1;}
  .cart-item .name{font-weight:700; font-size:14px; margin-bottom:2px;}
  .cart-item .unit{font-size:12px; color:var(--smoke);}
  .remove-x{
    background:none; border:none; color:var(--smoke); font-size:18px;
    cursor:pointer; padding:4px;
  }

  .summary-box{
    background:var(--char-3); border:1px solid var(--line);
    border-radius:14px; padding:16px; margin-top:12px;
  }
  .summary-row{display:flex; justify-content:space-between; font-size:14px; color:var(--smoke); margin-bottom:8px;}
  .summary-row.total{color:var(--bone); font-weight:800; font-size:17px; border-top:1px solid var(--line); padding-top:10px; margin-top:4px;}
  .summary-row.total .price{color:var(--gold);}

  .form-group{margin-bottom:12px;}
  .form-group label{display:block; font-size:13px; color:var(--smoke); margin-bottom:6px; font-weight:600;}
  .form-group input, .form-group textarea, .form-group select{
    width:100%; background:var(--char-2); border:1px solid var(--line);
    border-radius:10px; padding:11px 12px; color:var(--bone); font-size:14px;
    font-family:inherit;
  }
  .form-group textarea{resize:vertical; min-height:60px;}
  .form-group input:focus, .form-group textarea:focus, .form-group select:focus{
    outline:none; border-color:var(--flame);
  }

  .toggle-row{display:flex; gap:8px; margin-bottom:14px;}
  .toggle-opt{
    flex:1; text-align:center; padding:11px; border-radius:10px;
    background:var(--char-2); border:1px solid var(--line);
    font-size:13.5px; font-weight:700; color:var(--smoke); cursor:pointer;
  }
  .toggle-opt.active{background:var(--ember); border-color:var(--ember); color:#fff;}

  .btn-primary{
    width:100%; padding:14px; border-radius:12px; border:none;
    background:var(--ember); color:#fff; font-size:15px; font-weight:800;
    cursor:pointer; box-shadow:0 4px 16px rgba(194,42,31,0.35);
  }
  .btn-primary:disabled{opacity:0.4; box-shadow:none;}
  .btn-primary:active{transform:scale(0.98);}

  .empty-state{
    text-align:center; padding:60px 20px; color:var(--smoke);
  }
  .empty-state .icon{font-size:48px; margin-bottom:12px;}
  .empty-state p{font-size:14px;}

  /* ---------- Contact / branches ---------- */
  .branch-card{
    background:var(--char-3); border:1px solid var(--line);
    border-radius:16px; padding:16px; margin-bottom:12px;
  }
  .branch-card h3{font-size:16px; font-weight:800; margin-bottom:4px; display:flex; align-items:center; gap:6px;}
  .branch-card .addr{font-size:13px; color:var(--smoke); margin-bottom:12px;}
  .phone-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:9px 0; border-top:1px solid var(--line);
  }
  .phone-row:first-of-type{border-top:none;}
  .phone-row .num{font-size:14px; font-weight:600; direction:ltr; text-align:right; flex:1;}
  .call-btn{
    background:var(--char-2); border:1px solid var(--line); color:var(--flame);
    width:34px; height:34px; border-radius:10px; font-size:15px;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    text-decoration:none;
  }
  .wa-btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    background:#25D366; color:#fff; font-weight:700; font-size:14px;
    padding:12px; border-radius:10px; margin-top:14px; text-decoration:none;
  }
  .hotline-big{
    text-align:center; background:linear-gradient(135deg, var(--ember), var(--ember-dark));
    border-radius:16px; padding:20px; margin-bottom:16px;
  }
  .hotline-big .label{font-size:13px; color:rgba(255,255,255,0.85); margin-bottom:4px; font-weight:600;}
  .hotline-big .num{font-size:30px; font-weight:800; color:#fff; direction:ltr; letter-spacing:1px;}

  /* ---------- Admin ---------- */
  .admin-tabs{display:flex; gap:8px; margin-bottom:16px;}
  .admin-tab{
    flex:1; text-align:center; padding:10px; border-radius:10px;
    background:var(--char-3); border:1px solid var(--line);
    font-size:13px; font-weight:700; color:var(--smoke); cursor:pointer;
  }
  .admin-tab.active{background:var(--flame); border-color:var(--flame); color:#1a1210;}
  .order-card{
    background:var(--char-3); border:1px solid var(--line); border-radius:14px;
    padding:14px; margin-bottom:10px;
  }
  .order-card .top-row{display:flex; justify-content:space-between; margin-bottom:8px;}
  .order-card .ord-id{font-weight:800; font-size:14px;}
  .status-badge{
    font-size:11px; font-weight:700; padding:4px 10px; border-radius:12px;
  }
  .status-badge.pending{background:rgba(212,164,41,0.2); color:var(--gold);}
  .status-badge.preparing{background:rgba(232,114,44,0.2); color:var(--flame);}
  .status-badge.done{background:rgba(74,124,78,0.2); color:var(--success);}
  .order-card .items-list{font-size:12.5px; color:var(--smoke); margin-bottom:8px; line-height:1.6;}
  .status-select{
    width:100%; background:var(--char-2); border:1px solid var(--line);
    color:var(--bone); border-radius:8px; padding:8px; font-size:13px;
  }

  .toast{
    position:fixed; bottom:100px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--char-3); border:1px solid var(--line);
    color:var(--bone); padding:12px 20px; border-radius:12px;
    font-size:13.5px; font-weight:600;
    box-shadow:0 8px 24px rgba(0,0,0,0.4);
    z-index:100; opacity:0; pointer-events:none;
    transition:all .25s ease;
    max-width:400px;
    display:flex; align-items:center; gap:8px;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  .checkout-summary-mini{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--char-3); border:1px solid var(--line);
    border-radius:14px; padding:12px 14px; margin-bottom:12px;
  }

  ::selection{background:var(--ember); color:#fff;}
</style>
</head>

</html>
